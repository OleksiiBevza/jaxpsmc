name: JAX Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jax-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-jax-nightly:
    name: Tests against JAX nightly
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist chex absl-py numpy scipy

      - name: Install JAX nightly
        run: |
          python -m pip install --pre --upgrade jax jaxlib             -f https://storage.googleapis.com/jax-releases/jax_nightly_releases.html

      - name: Run tests
        run: |
          PYTHONPATH=. python -m pytest tests -vv -n auto
