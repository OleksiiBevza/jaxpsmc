name: JAX Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jax-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-jax-nightly:
    name: Tests against JAX nightly
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-xdist chex absl-py numpy scipy

      - name: Install JAX nightly
        run: |
          python -m pip install --upgrade --pre jax jaxlib \
            -i https://us-python.pkg.dev/ml-oss-artifacts-published/jax/simple/

      - name: Display JAX versions
        run: |
          python -c "import jax, jaxlib; print('jax:', jax.__version__); print('jaxlib:', jaxlib.__version__)"

      - name: Run tests
        run: |
          PYTHONPATH=. python -m pytest tests -vv -n auto
